{% extends "base.html" %}
{% block title %}原文 · {{ article.title }}{% endblock %}
{% block head %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
{% endblock %}
{% block content %}
<div class="article-head">
  <a class="btn small" href="/archive">← 返回归档</a>
  <a class="btn small" href="{{ article.url }}" target="_blank" rel="noopener">原始链接 ↗</a>
</div>

<h1>{{ article.title }}</h1>
<p class="muted">
  来源：{{ article.source_name }} · 主题：{{ article.topic }} ·
  {{ article.published_at or article.fetched_at }}
</p>

<article id="article-body" class="article-body"></article>

<div id="extra-videos" class="article-videos"></div>

<script>
  var md = {{ content_md | tojson }};
  var videos = {{ videos | tojson }};

  function videoHtml(u) {
    var isFile = /^\/media\//.test(u) || /\.(mp4|webm|mov|m4v|ogg|ogv)(\?|$)/i.test(u);
    if (isFile) {
      return '<video controls preload="metadata" class="article-video" src="' +
        u + '"></video>';
    }
    return '<div class="article-embed"><iframe src="' + u +
      '" frameborder="0" allowfullscreen></iframe></div>';
  }

  var html = window.marked ? marked.parse(md) : md.replace(/\n/g, '<br>');
  var used = {};
  // Put each video back at its original position (the [[VIDEO:N]] placeholder).
  html = html.replace(/\[\[VIDEO:(\d+)\]\]/g, function (_m, n) {
    var i = parseInt(n, 10);
    if (i >= 0 && i < videos.length) { used[i] = true; return videoHtml(videos[i]); }
    return '';
  });
  document.getElementById('article-body').innerHTML = html;

  // Any videos not referenced in the body get appended at the bottom.
  var extra = videos.filter(function (_u, i) { return !used[i]; });
  if (extra.length) {
    document.getElementById('extra-videos').innerHTML =
      '<h2>视频</h2>' + extra.map(videoHtml).join('');
  }
</script>
{% endblock %}
