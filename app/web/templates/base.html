<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Media Agent{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg"/>
  <link rel="stylesheet" href="/static/app.css"/>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <img class="brand-logo" src="/static/logo.svg" alt="Media Agent"/>
      <span class="brand-name">Media Agent</span>
    </a>
    <nav>
      <a href="/" class="{{ 'on' if active=='dashboard' else '' }}">仪表盘</a>
      <a href="/archive" class="{{ 'on' if active=='archive' else '' }}">归档</a>
      <a href="/drafts" class="{{ 'on' if active=='drafts' else '' }}">草稿</a>
      <a href="/sources" class="{{ 'on' if active=='sources' else '' }}">来源</a>
      <a href="/settings" class="{{ 'on' if active=='settings' else '' }}">设置</a>
    </nav>
    <div class="run-form">
      <button id="run-btn" type="button" class="btn primary" onclick="startRun()">▶ 立即运行</button>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- live run progress / logs -->
  <div id="run-panel" class="run-panel" style="display:none">
    <div class="run-panel-head">
      <span id="run-title">运行中…</span>
      <div>
        <span id="run-stats" class="run-stats"></span>
          <span id="run-controls">
            <button id="run-pause-btn" type="button" class="btn small" onclick="pauseRun()" style="display:none">⏸ 暂停</button>
            <button id="run-resume-btn" type="button" class="btn small" onclick="resumeRun()" style="display:none">▶ 恢复</button>
            <button id="run-stop-btn" type="button" class="btn small danger" onclick="stopRun()" style="display:none">⏹ 停止</button>
          </span>
          <button id="run-min-btn" type="button" class="run-minimize" onclick="toggleMinimize()" title="最小化">_</button>
          <button type="button" class="run-close" onclick="hideRunPanel()">×</button>
      </div>
    </div>
    <pre id="run-logs" class="run-logs"></pre>
  </div>

  <script>
  let runPollTimer = null;
  let _minimized = localStorage.getItem('runMinimized') === 'true';

  function showRunPanel() { document.getElementById('run-panel').style.display = 'flex'; applyMinimized(); }
  function hideRunPanel() { document.getElementById('run-panel').style.display = 'none'; }

  function applyMinimized() {
    const logs = document.getElementById('run-logs');
    const btn = document.getElementById('run-min-btn');
    if (!logs || !btn) return;
    logs.style.display = _minimized ? 'none' : '';
    btn.textContent = _minimized ? '‒' : '_';
  }

  function toggleMinimize() {
    _minimized = !_minimized;
    localStorage.setItem('runMinimized', _minimized);
    applyMinimized();
  }

  function renderRun(s) {
    const st = s.stats || {};
    let parts = [];
    if (s.source_total) {
      parts.push('来源 ' + s.source_current + '/' + s.source_total);
    }
    parts.push('抓取 ' + (st.fetched || 0) + ' · 归档 ' + (st.archived || 0) +
      ' · 草稿 ' + (st.drafted || 0));
    document.getElementById('run-stats').textContent = parts.join(' · ');
    const logs = document.getElementById('run-logs');
    const atBottom = logs.scrollTop + logs.clientHeight >= logs.scrollHeight - 20;
    logs.textContent = (s.logs || []).join('\n');
    if (atBottom) logs.scrollTop = logs.scrollHeight;

    const btn = document.getElementById('run-btn');
    const title = document.getElementById('run-title');
    const pauseBtn = document.getElementById('run-pause-btn');
    const resumeBtn = document.getElementById('run-resume-btn');
    const stopBtn = document.getElementById('run-stop-btn');
    if (s.running) {
      btn.disabled = true;
      btn.textContent = '⏳ 运行中…';
      if (s.paused) {
        title.textContent = '⏸ 已暂停';
        pauseBtn.style.display = 'none';
        resumeBtn.style.display = 'inline-block';
        stopBtn.style.display = 'inline-block';
      } else {
        title.textContent = '运行中…';
        pauseBtn.style.display = 'inline-block';
        resumeBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
      }
    } else {
      btn.disabled = false;
      btn.textContent = '▶ 立即运行';
      pauseBtn.style.display = 'none';
      resumeBtn.style.display = 'none';
      stopBtn.style.display = 'none';
      if (s.stopped) {
        title.textContent = '运行已停止';
      } else {
        title.textContent = s.error ? ('运行失败：' + s.error) : '运行完成';
      }
    }
  }

  async function pollRun() {
    try {
      const s = await (await fetch('/api/run-status')).json();
      renderRun(s);
      if (s.running) {
        runPollTimer = setTimeout(pollRun, 1200);
      }
    } catch (e) {
      runPollTimer = setTimeout(pollRun, 2000);
    }
  }

  async function startRun() {
    const btn = document.getElementById('run-btn');
    btn.disabled = true;
    btn.textContent = '⏳ 启动中…';
    showRunPanel();
    // Reset minimize for new run
    _minimized = false;
    localStorage.setItem('runMinimized', 'false');
    applyMinimized();
    try {
      const data = await (await fetch('/run', {method: 'POST'})).json();
      if (data.started === false) {
        document.getElementById('run-title').textContent = data.message || '已有运行在进行';
      }
    } catch (e) { /* ignore, poll will reflect state */ }
    pollRun();
  }

  async function pauseRun() {
    await fetch('/run/pause', {method: 'POST'});
    renderRun(await (await fetch('/api/run-status')).json());
  }
  async function resumeRun() {
    await fetch('/run/resume', {method: 'POST'});
    renderRun(await (await fetch('/api/run-status')).json());
  }
  async function stopRun() {
    if (!confirm('确定要停止当前运行吗？')) return;
    await fetch('/run/stop', {method: 'POST'});
    renderRun(await (await fetch('/api/run-status')).json());
    // Keep polling so logs keep arriving as the worker shuts down
  }

  // On page load, resume the panel if a run is in progress.
  document.addEventListener('DOMContentLoaded', async function () {
    try {
      const s = await (await fetch('/api/run-status')).json();
      if (s.running) { showRunPanel(); renderRun(s); pollRun(); }
    } catch (e) { /* ignore */ }

    // Check for other running operations (rewrite, narration, etc.)
    try {
      const ops = await (await fetch('/api/operations')).json();
      if (ops.running && ops.running.length > 0) {
        window.dispatchEvent(new CustomEvent('ops-resume', { detail: ops.running }));
      }
    } catch (e) { /* ignore */ }
  });
  </script>
</body>
</html>
