name: Build SadTalker Runtime

on:
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Release tag used for the downloadable runtime
        required: true
        default: sadtalker-runtime-v1

jobs:
  windows-cuda:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
          miniconda-version: latest
          auto-activate-base: false
          activate-environment: sadtalker

      - name: Install CUDA runtime and SadTalker dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade "pip<25" setuptools wheel
          python -m pip install \
            torch==2.0.1 torchvision==0.15.2 torchaudio==2.0.2 \
            --index-url https://download.pytorch.org/whl/cu118
          python -m pip install \
            "numpy==1.23.5" "opencv-python-headless==4.8.1.78" \
            "face_alignment==1.3.5" "imageio==2.19.3" \
            "imageio-ffmpeg==0.4.7" "librosa==0.9.2" numba \
            "resampy==0.3.1" "pydub==0.25.1" "scipy==1.10.1" \
            "kornia==0.6.8" tqdm "yacs==0.1.8" pyyaml \
            "joblib==1.2.0" "scikit-image==0.19.3" \
            "basicsr==1.4.2" "facexlib==0.3.0" gfpgan av safetensors \
            conda-pack

      - name: Vendor pinned SadTalker source
        run: |
          set -euxo pipefail
          git clone https://github.com/OpenTalker/SadTalker.git "$CONDA_PREFIX/sadtalker-src"
          git -C "$CONDA_PREFIX/sadtalker-src" checkout cd4c0465ae0b54a6f85af57f5c65fec9fe23e7f8
          rm -rf "$CONDA_PREFIX/sadtalker-src/.git"
          SP=$(python -c "import site; print(site.getsitepackages()[0])")
          printf '%s\n' "$CONDA_PREFIX/sadtalker-src" > "$SP/sadtalker-source.pth"
          python -c "import cv2, torch, torchvision, face_alignment, safetensors; print(torch.__version__)"
          python "$CONDA_PREFIX/sadtalker-src/inference.py" --help >/dev/null

      - name: Pack relocatable runtime
        run: |
          set -euxo pipefail
          conda pack -n sadtalker \
            -o sadtalker-runtime-win64-cuda118.tar.gz \
            --compress-level 6
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          asset = Path("sadtalker-runtime-win64-cuda118.tar.gz")
          archive_hash = hashlib.sha256(asset.read_bytes()).hexdigest()
          parts = []
          chunk_size = 1800 * 1024 * 1024
          with asset.open("rb") as source:
              index = 1
              while chunk := source.read(chunk_size):
                  part = Path(f"{asset.name}.part{index:03d}")
                  part.write_bytes(chunk)
                  parts.append({
                      "name": part.name,
                      "size": len(chunk),
                      "sha256": hashlib.sha256(chunk).hexdigest(),
                  })
                  index += 1
          manifest = {
              "version": 1,
              "archive": asset.name,
              "archive_size": asset.stat().st_size,
              "archive_sha256": archive_hash,
              "parts": parts,
          }
          Path("sadtalker-runtime-win64-cuda118.manifest.json").write_text(
              json.dumps(manifest, indent=2), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          asset.unlink()
          PY

      - name: Publish runtime
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
        run: |
          set -euxo pipefail
          gh release create "$RUNTIME_TAG" --repo ivanzwb/release \
            --title "SadTalker Windows CUDA Runtime" \
            --notes "Pinned Windows x64 runtime for media-agent. NVIDIA CUDA 11.8; models are downloaded separately." \
            2>/dev/null || true
          gh release upload "$RUNTIME_TAG" \
            sadtalker-runtime-win64-cuda118.manifest.json \
            sadtalker-runtime-win64-cuda118.tar.gz.part* \
            --repo ivanzwb/release --clobber
