name: Build CosyVoice Runtime

on:
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Release tag used for the downloadable runtime
        required: true
        default: cosyvoice-runtime-v1

jobs:
  windows-cuda:
    runs-on: windows-latest
    env:
      # pip 24 applies PIP_CONSTRAINT inside isolated PEP 517 build envs too.
      # openai-whisper==20231117 still imports pkg_resources at build time.
      PIP_CONSTRAINT: ${{ github.workspace }}/packaging/pip-build-constraints.txt
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
          miniconda-version: "py310_24.7.1-0"
          auto-activate-base: false
          activate-environment: cosyvoice

      - name: Install shared runtime dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade "pip<25" "setuptools<81" wheel
          # torch 2.6.1+cu128 was pruned from the PyTorch index; 2.7.x is the
          # oldest cu128 line still published. Same CUDA 12.8 wheel line.
          python -m pip install torch==2.7.1 torchaudio==2.7.1 \
            --index-url https://download.pytorch.org/whl/cu128
          python -m pip install \
            -r packaging/cosyvoice-runtime-requirements.txt

      - name: Vendor pinned CosyVoice source
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/FunAudioLLM/CosyVoice.git \
            "$CONDA_PREFIX/cosyvoice-src"
          git -C "$CONDA_PREFIX/cosyvoice-src" checkout \
            074ca6dc9e80a2f424f1f74b48bdd7d3fea531cc
          git -C "$CONDA_PREFIX/cosyvoice-src" submodule update --init --recursive
          rm -rf "$CONDA_PREFIX/cosyvoice-src/.git"
          SP=$(python -c "import site; print(site.getsitepackages()[0])")
          printf '%s\n' "$CONDA_PREFIX/cosyvoice-src" > "$SP/cosyvoice-source.pth"
          python -c "import torch, onnxruntime, whisper; from cosyvoice.cli.cosyvoice import CosyVoice2; assert torch.version.cuda"

      - name: Pack relocatable runtime
        run: |
          set -euxo pipefail
          python packaging/pack_cosyvoice_runtime.py \
            --prefix "$CONDA_PREFIX" --output-dir .

      - name: Publish runtime
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
        run: |
          set -euxo pipefail
          gh release create "$RUNTIME_TAG" --repo ivanzwb/release \
            --title "CosyVoice Windows CUDA Runtime" \
            --notes "Pinned Windows x64 CosyVoice runtime for media-agent. NVIDIA CUDA 12.8; CosyVoice2 model downloads separately." \
            2>/dev/null || true
          gh release upload "$RUNTIME_TAG" \
            cosyvoice-runtime-win64-cuda128.manifest.json \
            cosyvoice-runtime-win64-cuda128.tar.gz.part* \
            --repo ivanzwb/release --clobber

  macos-cpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            torch: "2.3.1"
          - runner: macos-15-intel
            arch: x64
            torch: "2.2.2"
    runs-on: ${{ matrix.runner }}
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/packaging/pip-build-constraints.txt
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
          miniconda-version: "py310_24.7.1-0"
          auto-activate-base: false
          activate-environment: cosyvoice
      - name: Install CPU runtime dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade "pip<25" "setuptools<81" wheel
          python -m pip install \
            "torch==${{ matrix.torch }}" "torchaudio==${{ matrix.torch }}"
          python -m pip install -r packaging/cosyvoice-runtime-requirements.txt
      - name: Vendor pinned CosyVoice source
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/FunAudioLLM/CosyVoice.git \
            "$CONDA_PREFIX/cosyvoice-src"
          git -C "$CONDA_PREFIX/cosyvoice-src" checkout \
            074ca6dc9e80a2f424f1f74b48bdd7d3fea531cc
          git -C "$CONDA_PREFIX/cosyvoice-src" submodule update --init --recursive
          rm -rf "$CONDA_PREFIX/cosyvoice-src/.git"
          SP=$(python -c "import site; print(site.getsitepackages()[0])")
          printf '%s\n' "$CONDA_PREFIX/cosyvoice-src" > "$SP/cosyvoice-source.pth"
          python -c "import torch, onnxruntime, whisper; from cosyvoice.cli.cosyvoice import CosyVoice2; assert not torch.cuda.is_available()"
          python packaging/cosyvoice_worker.py --help >/dev/null
      - name: Pack relocatable runtime
        run: |
          python packaging/pack_cosyvoice_runtime.py \
            --prefix "$CONDA_PREFIX" --output-dir . \
            --asset-name "cosyvoice-runtime-macos-${{ matrix.arch }}-cpu.tar.gz"
      - name: Publish runtime
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
        run: |
          gh release create "$RUNTIME_TAG" --repo ivanzwb/release \
            --title "CosyVoice Managed Runtimes" \
            --notes "Managed runtimes for media-agent; models download separately." \
            2>/dev/null || true
          gh release upload "$RUNTIME_TAG" \
            "cosyvoice-runtime-macos-${{ matrix.arch }}-cpu.manifest.json" \
            cosyvoice-runtime-macos-${{ matrix.arch }}-cpu.tar.gz.part* \
            --repo ivanzwb/release --clobber
