name: Build Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend (React SPA)
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install "click<8.2" pyinstaller playwright

      # Download embeddable Python for CosyVoice sidecar env
      - name: Download embeddable Python
        shell: pwsh
        run: |
          $url = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
          $out = "packaging/python-embed-win64.zip"
          if (-not (Test-Path $out)) {
            Invoke-WebRequest -Uri $url -OutFile $out
          }
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "packaging/get-pip.py"

      - name: Build
        shell: pwsh
        run: |
          pyinstaller --onedir `
            --collect-all "app" `
            --name "media-agent" `
            --add-data "app/web/static;app/web/static" `
            --add-data "frontend/dist;frontend/dist" `
            --add-data "app/licensing/public_key.b64;app/licensing" `
            --add-data "packaging/python-embed-win64.zip;packaging" `
            --add-data "packaging/get-pip.py;packaging" `
            --add-data "packaging/cosyvoice_worker.py;packaging" `
            --exclude-module "torch" `
            --exclude-module "zstandard" `
            --exclude-module "torchvision" `
            --exclude-module "torchaudio" `
            --exclude-module "soundfile" `
            --exclude-module "transformers" `
            --exclude-module "scipy" `
            --exclude-module "matplotlib" `
            --exclude-module "pandas" `
            --exclude-module "sklearn" `
            --exclude-module "scikit-learn" `
            --exclude-module "librosa" `
            --exclude-module "numba" `
            --exclude-module "onnxruntime" `
            --exclude-module "tensorflow" `
            --exclude-module "pyarrow" `
            --exclude-module "IPython" `
            --exclude-module "jedi" `
            --exclude-module "parso" `
            --exclude-module "pytest" `
            --exclude-module "nbformat" `
            --exclude-module "jsonschema" `
            --exclude-module "lark" `
            --exclude-module "modelscope" `
            --exclude-module "lightning" `
            --exclude-module "hydra" `
            --exclude-module "altair" `
            --hidden-import "uvicorn" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "fastapi" `
            --hidden-import "fastapi.staticfiles" `
            --hidden-import "starlette.staticfiles" `
            --hidden-import "jinja2" `
            --hidden-import "cryptography" `
            --hidden-import "cryptography.fernet" `
            --hidden-import "apscheduler" `
            --hidden-import "apscheduler.triggers.cron" `
            --hidden-import "httpx" `
            --hidden-import "playwright" `
            --hidden-import "readability" `
            --hidden-import "readability-lxml" `
            --hidden-import "feedparser" `
            --hidden-import "dateparser" `
            --hidden-import "ddgs" `
            --hidden-import "json5" `
            --hidden-import "lxml" `
            --hidden-import "trafilatura" `
            --hidden-import "curl_cffi" `
            --hidden-import "cosyvoice" `
            --collect-all "playwright" `
            --console `
            packaging/run_app.py
          Remove-Item -Recurse -Force build, media-agent.spec -ErrorAction SilentlyContinue
          Copy-Item setup-optional.bat dist/media-agent/setup-optional.bat

      - name: Package (zip)
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python -c "
          import os, zipfile
          name = 'media-agent-' + os.environ['VERSION'] + '-win64.zip'
          with zipfile.ZipFile(os.path.join('dist', name), 'w', zipfile.ZIP_DEFLATED) as z:
              for dp, _, files in os.walk('dist/media-agent'):
                  for f in files:
                      fp = os.path.join(dp, f)
                      z.write(fp, os.path.relpath(fp, 'dist'))
          print('Created dist/' + name)
          "

      # Upload directly to the release repo (no cross-job artifacts, which
      # would consume the Actions artifact-storage quota).
      - name: Publish to release repo
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          file=$(ls dist/media-agent-*.zip | head -n1)
          echo "Uploading $file to ivanzwb/release@$VERSION"
          gh release create "$VERSION" --repo ivanzwb/release \
            --title "media-agent $VERSION" \
            --notes "media-agent $VERSION 自动构建包（Windows / macOS Intel(x86_64) + Apple Silicon(arm64)）" 2>/dev/null || true
          gh release upload "$VERSION" "$file" --repo ivanzwb/release --clobber

  macos:
    # Build a native package per architecture so it installs on BOTH Intel and
    # Apple Silicon Macs. macos-latest is now Apple Silicon (arm64) only, which
    # is why the single build failed to install on some (Intel) models.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13      # Intel (x86_64)
            arch: x86_64
          - runner: macos-14      # Apple Silicon (arm64)
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend (React SPA)
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install "click<8.2" pyinstaller playwright

      # Download embeddable Python for CosyVoice sidecar env (best-effort:
      # official embeddables are Windows-only, so this may be absent on macOS —
      # the sidecar bootstraps at runtime instead). Keep a file present so the
      # --add-data below never fails the build.
      - name: Download embeddable Python
        run: |
          url="https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-macosx10.9-${{ matrix.arch }}.tar.gz"
          curl -sfL "$url" -o packaging/python-embed-macos.tar.gz || echo "embed python unavailable for ${{ matrix.arch }}; sidecar will bootstrap at runtime"
          [ -f packaging/python-embed-macos.tar.gz ] || : > packaging/python-embed-macos.tar.gz
          curl -sL "https://bootstrap.pypa.io/get-pip.py" -o packaging/get-pip.py

      - name: Build
        run: |
          pyinstaller --onedir \
            --collect-all "app" \
            --name "media-agent" \
            --add-data "app/web/static:app/web/static" \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "app/licensing/public_key.b64:app/licensing" \
            --add-data "packaging/python-embed-macos.tar.gz:packaging" \
            --add-data "packaging/get-pip.py:packaging" \
            --add-data "packaging/cosyvoice_worker.py:packaging" \
            --exclude-module "torch" \
            --exclude-module "zstandard" \
            --exclude-module "torchvision" \
            --exclude-module "torchaudio" \
            --exclude-module "soundfile" \
            --exclude-module "transformers" \
            --exclude-module "scipy" \
            --exclude-module "matplotlib" \
            --exclude-module "pandas" \
            --exclude-module "sklearn" \
            --exclude-module "scikit-learn" \
            --exclude-module "librosa" \
            --exclude-module "numba" \
            --exclude-module "onnxruntime" \
            --exclude-module "tensorflow" \
            --exclude-module "pyarrow" \
            --exclude-module "IPython" \
            --exclude-module "jedi" \
            --exclude-module "parso" \
            --exclude-module "pytest" \
            --exclude-module "nbformat" \
            --exclude-module "jsonschema" \
            --exclude-module "lark" \
            --exclude-module "modelscope" \
            --exclude-module "lightning" \
            --exclude-module "hydra" \
            --exclude-module "altair" \
            --hidden-import "uvicorn" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "fastapi" \
            --hidden-import "fastapi.staticfiles" \
            --hidden-import "starlette.staticfiles" \
            --hidden-import "jinja2" \
            --hidden-import "cryptography" \
            --hidden-import "cryptography.fernet" \
            --hidden-import "apscheduler" \
            --hidden-import "apscheduler.triggers.cron" \
            --hidden-import "httpx" \
            --hidden-import "playwright" \
            --hidden-import "readability" \
            --hidden-import "readability-lxml" \
            --hidden-import "feedparser" \
            --hidden-import "dateparser" \
            --hidden-import "ddgs" \
            --hidden-import "json5" \
            --hidden-import "lxml" \
            --hidden-import "trafilatura" \
            --hidden-import "curl_cffi" \
            --hidden-import "cosyvoice" \
            --collect-all "playwright" \
            --console \
            packaging/run_app.py
          rm -rf build media-agent.spec

      - name: Package (zip)
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          cp setup-optional.sh dist/media-agent/
          python -c "
          import os, zipfile
          name = 'media-agent-' + os.environ['VERSION'] + '-macos-' + os.environ['ARCH'] + '.zip'
          with zipfile.ZipFile(os.path.join('dist', name), 'w', zipfile.ZIP_DEFLATED) as z:
              for dp, _, files in os.walk('dist/media-agent'):
                  for f in files:
                      fp = os.path.join(dp, f)
                      z.write(fp, os.path.relpath(fp, 'dist'))
          print('Created dist/' + name)
          "

      # Upload directly to the release repo (no cross-job artifacts, which
      # would consume the Actions artifact-storage quota).
      - name: Publish to release repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          file=$(ls dist/media-agent-*.zip | head -n1)
          echo "Uploading $file to ivanzwb/release@$VERSION"
          gh release create "$VERSION" --repo ivanzwb/release \
            --title "media-agent $VERSION" \
            --notes "media-agent $VERSION 自动构建包（Windows / macOS Intel(x86_64) + Apple Silicon(arm64)）" 2>/dev/null || true
          gh release upload "$VERSION" "$file" --repo ivanzwb/release --clobber

  # Prebuilt CosyVoice runtime: a fully self-contained, conda-pack'd Python env
  # with ALL native deps prebuilt (torch/torchaudio/onnxruntime + pynini/openfst
  # from conda-forge, so text normalization works WITHOUT the user compiling
  # anything). Shipped as a separate release asset (large). The CosyVoice model
  # itself is NOT bundled — it downloads on first use.
  cosyvoice-runtime-win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}      # login shell so `conda activate` works
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"     # CosyVoice's recommended runtime
          miniconda-version: latest
          auto-activate-base: false
          activate-environment: cosy

      - name: Install prebuilt native deps (conda-forge — no compilation)
        run: |
          set -e
          # pynini/openfst are the ONLY compile-heavy deps; conda-forge ships
          # prebuilt binaries so nothing is compiled here or on the user's box.
          conda install -y -c conda-forge pynini openfst
          # Matched, prebuilt CPU wheels for torch/torchaudio (the PyTorch CPU
          # index keeps the pair in lockstep).
          pip install torch==2.5.1 torchaudio==2.5.1 \
            --index-url https://download.pytorch.org/whl/cpu
          # Everything else as prebuilt wheels.
          pip install "numpy<2" onnxruntime soundfile pydub openai-whisper \
            huggingface_hub conda-pack \
            conformer diffusers gdown hydra-core HyperPyYAML inflect librosa \
            lightning matplotlib modelscope networkx omegaconf protobuf \
            pydantic rich tensorboard transformers wget || true
          # WeTextProcessing is pure-python; with conda's pynini already present
          # it installs WITHOUT compiling. --no-deps prevents pip from pulling a
          # source pynini and rebuilding.
          pip install --no-deps WeTextProcessing || echo "WeTextProcessing optional; skipped"

      - name: Vendor CosyVoice source into the env (relocatable)
        run: |
          set -e
          PREFIX="$CONDA_PREFIX"
          git clone --depth 1 https://github.com/FunAudioLLM/CosyVoice.git "$PREFIX/cosyvoice-src"
          git clone --depth 1 https://github.com/shivammehta25/Matcha-TTS.git \
            "$PREFIX/cosyvoice-src/third_party/Matcha-TTS" || true
          # A .pth that resolves the vendored source via sys.prefix AT RUNTIME,
          # so it keeps working after conda-pack relocates the env on the user's
          # machine (absolute paths would break).
          SP=$(python -c "import site,sys;print([p for p in site.getsitepackages() if p.endswith('site-packages')][0])")
          cat > "$SP/_cosyvoice_repo.pth" <<'PTH'
          import sys, os, site; site.addsitedir(os.path.join(sys.prefix, 'cosyvoice-src')); site.addsitedir(os.path.join(sys.prefix, 'cosyvoice-src', 'third_party', 'Matcha-TTS'))
          PTH
          # Sanity: the import chain must resolve inside the env.
          python -c "import torch, torchaudio, onnxruntime; print('native ok')"
          python -c "import cosyvoice.cli.cosyvoice as m; print('cosyvoice import ok')" || echo "WARN: cosyvoice import needs tuning"

      - name: Pack runtime (conda-pack)
        run: |
          set -e
          conda pack -n cosy -o cosyvoice-runtime-win64.tar.gz --compress-level 6
          ls -lh cosyvoice-runtime-win64.tar.gz

      - name: Publish runtime to release repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          gh release create "$VERSION" --repo ivanzwb/release \
            --title "media-agent $VERSION" \
            --notes "media-agent $VERSION" 2>/dev/null || true
          gh release upload "$VERSION" cosyvoice-runtime-win64.tar.gz \
            --repo ivanzwb/release --clobber
