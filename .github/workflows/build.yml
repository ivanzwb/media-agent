name: Build Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install "click<8.2" pyinstaller fish-audio-sdk playwright

      - name: Build
        shell: pwsh
        run: |
          pyinstaller --onedir `
            --name "media-agent" `
            --add-data "app/web/templates;app/web/templates" `
            --add-data "app/web/static;app/web/static" `
            --add-data "app/licensing/public_key.b64;app/licensing" `
            --exclude-module "torch" `
            --exclude-module "torchvision" `
            --exclude-module "torchaudio" `
            --exclude-module "transformers" `
            --exclude-module "scipy" `
            --exclude-module "matplotlib" `
            --exclude-module "pandas" `
            --exclude-module "sklearn" `
            --exclude-module "scikit-learn" `
            --exclude-module "librosa" `
            --exclude-module "numba" `
            --exclude-module "soundfile" `
            --exclude-module "onnxruntime" `
            --exclude-module "tensorflow" `
            --exclude-module "pyarrow" `
            --exclude-module "IPython" `
            --exclude-module "jedi" `
            --exclude-module "parso" `
            --exclude-module "pytest" `
            --exclude-module "nbformat" `
            --exclude-module "jsonschema" `
            --exclude-module "lark" `
            --exclude-module "modelscope" `
            --exclude-module "lightning" `
            --exclude-module "hydra" `
            --exclude-module "altair" `
            --hidden-import "uvicorn" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "fastapi" `
            --hidden-import "jinja2" `
            --hidden-import "cryptography" `
            --hidden-import "cryptography.fernet" `
            --hidden-import "apscheduler" `
            --hidden-import "apscheduler.triggers.cron" `
            --hidden-import "httpx" `
            --console `
            app/cli.py
          Remove-Item -Recurse -Force build, media-agent.spec -ErrorAction SilentlyContinue
          Copy-Item setup-optional.bat dist/media-agent/setup-optional.bat

      - name: Package (zip)
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python -c "
          import os, zipfile
          name = 'media-agent-' + os.environ['VERSION'] + '-win64.zip'
          with zipfile.ZipFile(os.path.join('dist', name), 'w', zipfile.ZIP_DEFLATED) as z:
              for dp, _, files in os.walk('dist/media-agent'):
                  for f in files:
                      fp = os.path.join(dp, f)
                      z.write(fp, os.path.relpath(fp, 'dist'))
          print('Created dist/' + name)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: media-agent-windows
          path: dist/media-agent-*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install "click<8.2" pyinstaller fish-audio-sdk playwright

      - name: Build
        run: |
          pyinstaller --onedir \
            --name "media-agent" \
            --add-data "app/web/templates:app/web/templates" \
            --add-data "app/web/static:app/web/static" \
            --add-data "app/licensing/public_key.b64:app/licensing" \
            --exclude-module "torch" \
            --exclude-module "torchvision" \
            --exclude-module "torchaudio" \
            --exclude-module "transformers" \
            --exclude-module "scipy" \
            --exclude-module "matplotlib" \
            --exclude-module "pandas" \
            --exclude-module "sklearn" \
            --exclude-module "scikit-learn" \
            --exclude-module "librosa" \
            --exclude-module "numba" \
            --exclude-module "soundfile" \
            --exclude-module "onnxruntime" \
            --exclude-module "tensorflow" \
            --exclude-module "pyarrow" \
            --exclude-module "IPython" \
            --exclude-module "jedi" \
            --exclude-module "parso" \
            --exclude-module "pytest" \
            --exclude-module "nbformat" \
            --exclude-module "jsonschema" \
            --exclude-module "lark" \
            --exclude-module "modelscope" \
            --exclude-module "lightning" \
            --exclude-module "hydra" \
            --exclude-module "altair" \
            --hidden-import "uvicorn" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "fastapi" \
            --hidden-import "jinja2" \
            --hidden-import "cryptography" \
            --hidden-import "cryptography.fernet" \
            --hidden-import "apscheduler" \
            --hidden-import "apscheduler.triggers.cron" \
            --hidden-import "httpx" \
            --console \
            app/cli.py
          rm -rf build media-agent.spec

      - name: Package (zip)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cp setup-optional.sh dist/media-agent/
          python -c "
          import os, zipfile
          name = 'media-agent-' + os.environ['VERSION'] + '-macos.zip'
          with zipfile.ZipFile(os.path.join('dist', name), 'w', zipfile.ZIP_DEFLATED) as z:
              for dp, _, files in os.walk('dist/media-agent'):
                  for f in files:
                      fp = os.path.join(dp, f)
                      z.write(fp, os.path.relpath(fp, 'dist'))
          print('Created dist/' + name)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: media-agent-macos
          path: dist/media-agent-*.zip

  publish:
    # Push the built packages into the public release repo (ivanzwb/release)
    # under media-agent/release/. Requires a PAT secret RELEASE_TOKEN with
    # Contents:write on ivanzwb/release.
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          path: _artifacts

      - name: Publish as a GitHub Release on the release repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          # Release assets allow up to 2GB/file — git push is capped at 100MB,
          # and our packages are ~120MB, so we MUST use Releases, not commits.
          files=$(find _artifacts -name 'media-agent-*.zip')
          echo "Uploading: $files"
          if gh release view "$VERSION" --repo ivanzwb/release >/dev/null 2>&1; then
            gh release upload "$VERSION" $files --repo ivanzwb/release --clobber
          else
            gh release create "$VERSION" $files --repo ivanzwb/release \
              --title "media-agent $VERSION" \
              --notes "media-agent $VERSION 自动构建包（Windows / macOS）"
          fi
